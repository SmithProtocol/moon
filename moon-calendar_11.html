<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Calendar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .current-month {
            font-size: 1.5em;
            font-weight: 600;
            min-width: 200px;
            text-align: center;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .day-header {
            text-align: center;
            font-weight: 600;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            font-size: 0.9em;
        }

        .day-cell {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 12px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .day-cell:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .day-cell.other-month {
            opacity: 0.3;
        }

        .day-number {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .moon-icon {
            font-size: 2em;
            text-align: center;
            margin: 8px 0;
        }

        .moon-phase {
            font-size: 0.75em;
            text-align: center;
            margin-bottom: 8px;
            color: #ffd700;
            font-weight: 500;
        }

        .moon-times {
            font-size: 0.7em;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.4;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
        }

        @media (max-width: 768px) {
            .calendar {
                gap: 5px;
                padding: 10px;
            }

            .day-cell {
                min-height: 100px;
                padding: 6px;
                font-size: 0.85em;
            }

            .day-number {
                font-size: 1em;
                margin-bottom: 4px;
            }

            .moon-icon {
                font-size: 1.3em;
                margin: 4px 0;
            }

            .moon-phase {
                font-size: 0.65em;
                margin-bottom: 4px;
            }

            .moon-times {
                font-size: 0.65em;
            }

            .day-header {
                font-size: 0.75em;
                padding: 8px 4px;
            }

            .current-month {
                font-size: 1.1em;
                min-width: 150px;
            }

            .nav-btn {
                padding: 8px 12px;
                font-size: 14px;
            }

            .nav-controls {
                gap: 10px;
            }

            .container {
                padding: 0;
            }

            body {
                padding: 10px;
            }
        }

        @media (max-width: 480px) {
            .day-cell {
                min-height: 85px;
                padding: 4px;
            }

            .day-number {
                font-size: 0.9em;
            }

            .moon-icon {
                font-size: 1.1em;
            }

            .moon-phase {
                font-size: 0.6em;
            }

            .moon-times {
                font-size: 0.6em;
            }

            .day-header {
                font-size: 0.7em;
                padding: 6px 2px;
            }

            .current-month {
                font-size: 1em;
            }

            .nav-btn {
                padding: 6px 10px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-controls">
            <button class="nav-btn" onclick="previousMonth()">← Previous</button>
            <div class="current-month" id="currentMonth"></div>
            <button class="nav-btn" onclick="nextMonth()">Next →</button>
        </div>

        <div id="calendar" class="calendar">
            <div class="loading">Loading moon data...</div>
        </div>
    </div>

    <script>
        let currentDate = new Date();

        const MOON_PHASES = {
            0: { name: 'New Moon', icon: '🌑' },
            0.125: { name: 'Waxing Crescent', icon: '🌒' },
            0.25: { name: 'First Quarter', icon: '🌓' },
            0.375: { name: 'Waxing Gibbous', icon: '🌔' },
            0.5: { name: 'Full Moon', icon: '🌕' },
            0.625: { name: 'Waning Gibbous', icon: '🌖' },
            0.75: { name: 'Last Quarter', icon: '🌗' },
            0.875: { name: 'Waning Crescent', icon: '🌘' }
        };

        function getMoonPhase(date) {
            let year = date.getFullYear();
            let month = date.getMonth() + 1;
            const day = date.getDate();
            
            let c, e, jd, b;
            
            if (month < 3) {
                year--;
                month += 12;
            }
            
            ++month;
            c = 365.25 * year;
            e = 30.6 * month;
            jd = c + e + day - 694039.09;
            jd /= 29.5305882;
            b = parseInt(jd);
            jd -= b;
            b = Math.round(jd * 8);
            
            if (b >= 8) b = 0;
            
            const phase = b / 8;
            
            const phases = Object.keys(MOON_PHASES).map(Number).sort((a, b) => a - b);
            let closestPhase = phases[0];
            let minDiff = Math.abs(phase - closestPhase);
            
            for (let p of phases) {
                const diff = Math.abs(phase - p);
                if (diff < minDiff) {
                    minDiff = diff;
                    closestPhase = p;
                }
            }
            
            return MOON_PHASES[closestPhase];
        }

        function calculateMoonTimes(date, latitude = 31.546315, longitude = -99.382933) {
            // Convert to radians
            const lat = latitude * Math.PI / 180;
            const lng = longitude * Math.PI / 180;
            
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            
            // Calculate Julian Day
            let a = Math.floor((14 - month) / 12);
            let y = year + 4800 - a;
            let m = month + 12 * a - 3;
            let jd = day + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
            
            // Add 0.5 to get Julian Day at noon UTC
            jd = jd + 0.5;
            
            // Days since J2000.0
            const d = jd - 2451545.0;
            
            // Moon's mean longitude
            const L = (218.316 + 13.176396 * d) % 360;
            // Mean anomaly
            const M = (134.963 + 13.064993 * d) % 360;
            // Mean distance
            const F = (93.272 + 13.229350 * d) % 360;
            
            // Convert to radians
            const Lr = L * Math.PI / 180;
            const Mr = M * Math.PI / 180;
            const Fr = F * Math.PI / 180;
            
            // Moon's ecliptic longitude (simplified)
            const lambda = Lr + 
                (6.289 * Math.sin(Mr)) * Math.PI / 180 +
                (1.274 * Math.sin(2 * Lr - Mr)) * Math.PI / 180 +
                (0.658 * Math.sin(2 * Lr)) * Math.PI / 180 +
                (0.214 * Math.sin(2 * Mr)) * Math.PI / 180 +
                (-0.186 * Math.sin(Lr)) * Math.PI / 180;
            
            // Moon's ecliptic latitude
            const beta = 
                (5.128 * Math.sin(Fr)) * Math.PI / 180 +
                (0.280 * Math.sin(Mr + Fr)) * Math.PI / 180 +
                (0.277 * Math.sin(Mr - Fr)) * Math.PI / 180;
            
            // Distance to moon in km
            const distance = 385001 - 20905 * Math.cos(Mr);
            
            // Obliquity of the ecliptic
            const epsilon = (23.439 - 0.0000004 * d) * Math.PI / 180;
            
            // Convert to equatorial coordinates
            const alpha = Math.atan2(Math.sin(lambda) * Math.cos(epsilon) - Math.tan(beta) * Math.sin(epsilon), Math.cos(lambda));
            const delta = Math.asin(Math.sin(beta) * Math.cos(epsilon) + Math.cos(beta) * Math.sin(epsilon) * Math.sin(lambda));
            
            // Local sidereal time at midnight
            const gmst = (280.460 + 360.985647 * d) % 360;
            const lst = (gmst + longitude) * Math.PI / 180;
            
            // Hour angle for rise/set (accounting for parallax and refraction)
            const h0 = (-0.833 - 0.0347 * Math.sqrt(distance / 385001)) * Math.PI / 180; // Standard refraction + parallax correction
            
            const cosH = (Math.sin(h0) - Math.sin(lat) * Math.sin(delta)) / (Math.cos(lat) * Math.cos(delta));
            
            let moonrise, moonset;
            
            if (cosH > 1) {
                // Moon never rises
                return { rise: '--:--', set: '--:--' };
            } else if (cosH < -1) {
                // Moon never sets
                return { rise: 'Up all day', set: 'Up all day' };
            }
            
            const H = Math.acos(cosH);
            
            // Transit time (when moon crosses meridian)
            let transitHours = (alpha - lst) * 12 / Math.PI;
            if (transitHours < 0) transitHours += 24;
            if (transitHours > 24) transitHours -= 24;
            
            // Rise and set times
            let riseHours = transitHours - H * 12 / Math.PI;
            let setHours = transitHours + H * 12 / Math.PI;
            
            // Convert from UTC to Central Time (UTC-6)
            // Note: This doesn't account for DST, which would be UTC-5
            const timezoneOffsetHours = -6;
            riseHours += timezoneOffsetHours;
            setHours += timezoneOffsetHours;
            
            // Normalize to 0-24 range
            while (riseHours < 0) riseHours += 24;
            while (riseHours >= 24) riseHours -= 24;
            while (setHours < 0) setHours += 24;
            while (setHours >= 24) setHours -= 24;
            
            // Format times
            const formatTime = (hours) => {
                const h = Math.floor(hours);
                const m = Math.floor((hours - h) * 60);
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
            };
            
            // Sometimes moon rises or sets outside the current day
            // This is a simplified version - real astronomical calculators iterate
            return {
                rise: formatTime(riseHours),
                set: formatTime(setHours)
            };
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('currentMonth').textContent = 
                currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - startDate.getDay());
            
            const calendarHTML = [];
            
            const dayHeaders = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            dayHeaders.forEach(day => {
                calendarHTML.push(`<div class="day-header">${day}</div>`);
            });
            
            const currentDateObj = new Date(startDate);
            for (let i = 0; i < 42; i++) {
                const isCurrentMonth = currentDateObj.getMonth() === month;
                const moonPhase = getMoonPhase(currentDateObj);
                const moonTimes = calculateMoonTimes(currentDateObj);
                
                calendarHTML.push(`
                    <div class="day-cell ${!isCurrentMonth ? 'other-month' : ''}">
                        <div class="day-number">${currentDateObj.getDate()}</div>
                        <div class="moon-icon">${moonPhase.icon}</div>
                        <div class="moon-phase">${moonPhase.name}</div>
                        <div class="moon-times">
                            ↑ ${moonTimes.rise}<br>
                            ↓ ${moonTimes.set}
                        </div>
                    </div>
                `);
                
                currentDateObj.setDate(currentDateObj.getDate() + 1);
            }
            
            document.getElementById('calendar').innerHTML = calendarHTML.join('');
        }

        function previousMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        }

        renderCalendar();
    </script>
</body>
</html>
